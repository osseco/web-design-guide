# Pins the Socket CLI used by .github/workflows/socket.yml. uv.lock holds every
# transitive dependency with hashes; Dependabot (uv ecosystem) keeps both current.
[project]
name = "socket-scan"
version = "0"
requires-python = ">=3.12"
dependencies = ["socketsecurity==2.12.0"]

[tool.uv]
package = false
