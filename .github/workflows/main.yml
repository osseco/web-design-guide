# Runs every pr.yml check on main, then publishes site/ to GitHub Pages once
# they all pass. Settings → Pages → Source: GitHub Actions.
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read

  codeql:
    uses: $/.github/workflows/codeql.yml
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

  zizmor:
    uses: $/.github/workflows/zizmor.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  actionlint:
    uses: $/.github/workflows/actionlint.yml
    permissions:
      security-events: write
      contents: read
      actions: read

  socket:
    uses: $/.github/workflows/socket.yml
    secrets:
      SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
      actions: read

  build:
    needs: [check, codeql, zizmor, actionlint, socket]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          install: false
          cache: true
      - uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'restore' }}
          job-summary: errors
      - run: sfw pnpm install --frozen-lockfile
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.ref == 'refs/heads/main'
        id: pages
      - name: Build
        run: sfw pnpm --filter osseco-web-design-site build
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
