name: Socket
run-name: Socket Security scan

on:
  workflow_call:
    secrets:
      SOCKET_SECURITY_API_KEY:
        required: false
  schedule:
    - cron: "27 3 * * 1"

permissions: {}

jobs:
  socket-security:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      pull-requests: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For PRs, fetch one additional commit for proper diff analysis
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: osseco/setup-sfw-free@e1cbeae80920eb20b289196bb420d5f45a45ead1 # v1.15.6-0.2.0
        with:
          cache: ${{ github.ref == 'refs/heads/main' && 'true' || 'restore' }}
      # The Socket CLI and every dependency come from .github/socket/uv.lock,
      # hash-checked; --locked fails if the lock is out of date.
      - name: Install Socket CLI
        run: sfw uv sync --locked --project .github/socket
      - name: Run Socket Security Scan
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Not PR_NUMBER: socketcli falls back to that env var when
          # --pr-number is 0, and "0" turns a push into a PR diff.
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || 0 }}
          EVENT_NAME: ${{ github.event_name }}
        # --scm github only knows pull_request and push; on schedule it exits
        # 0 without scanning. Other events scan every manifest into SARIF.
        # Code scanning closes alerts missing from the latest upload, so the
        # SARIF must hold all of them: --strict-blocking adds existing alerts
        # (--sarif-scope full needs --reach, which is Enterprise-only).
        run: |
          set -euo pipefail
          args=(--target-path "$GITHUB_WORKSPACE" --strict-blocking)
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--scm github --pr-number "$PULL_REQUEST_NUMBER")
          else
            args+=(--ignore-commit-files --sarif-file socket.sarif)
            # Report-only: exit 0 even with blocking alerts.
            if [ "$EVENT_NAME" = schedule ]; then
              args+=(--disable-blocking)
            fi
          fi
          uv run --locked --offline --project .github/socket socketcli "${args[@]}"
      # PRs don't upload: GitHub doesn't show fixed alerts on PRs, and the PR
      # comment already covers new ones.
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          sarif_file: socket.sarif
          category: socket
