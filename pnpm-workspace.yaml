packages:
  - templates
  - site

# No catalog here on purpose: templates/package.json must work once copied out
# of this repository, so it pins versions itself. site/src/versions.test.ts
# fails when site and templates disagree on a shared dependency.

# Versions must be 7 days old before pnpm installs them, direct and transitive
# alike. Same rule as Dependabot's cooldown.
minimumReleaseAge: 10080

# Dependency build scripts are denied unless listed here with true.
strictDepBuilds: true
allowBuilds:
  fsevents: true
