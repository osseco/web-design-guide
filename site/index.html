<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>osseco web design guide</title>
    <meta
      name="description"
      content="How osseco web frontends and GitHub Pages sites are built and styled: stack, tokens, components, layout, accessibility and deployment."
    />
    <script>
      // Same as templates/index.html.
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("osseco-theme");
        } catch {}
        const dark =
          stored === "dark" ||
          (stored !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-background text-foreground antialiased">
    <div id="root" class="min-h-full flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
